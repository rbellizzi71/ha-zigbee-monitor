name: Release

# Pushing a version tag publishes a release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# 1. The tag must match the version in zigbee_monitor/config.yaml.
# 2. The add-on images are built and pushed:
#      ghcr.io/<owner>/{amd64,aarch64}-addon-zigbee_monitor:X.Y.Z (and :latest, except for
#      pre-releases such as X.Y.Z-beta.N)
# 3. A GitHub release is created with the notes of that version in CHANGELOG.md.
# A pre-release for testing is built by running this workflow by hand on its branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check version
        id: version
        run: |
          version=$(python3 -c "import yaml; print(yaml.safe_load(open('zigbee_monitor/config.yaml'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match config.yaml version $version (expected v$version)"
            exit 1
          fi
          if ! grep -q "^## $version\$" zigbee_monitor/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zigbee_monitor
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-zigbee_monitor:${{ needs.version.outputs.version }}
            ${{ !contains(needs.version.outputs.version, '-') && format('ghcr.io/{0}/{1}-addon-zigbee_monitor:latest', github.repository_owner, matrix.arch) || '' }}
          labels: |
            io.hass.name=Zigbee Monitor
            io.hass.description=Watches your Zigbee2MQTT devices
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

  release:
    # Only after both images are published.
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' zigbee_monitor/CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag
